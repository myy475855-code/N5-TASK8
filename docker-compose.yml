services:
  postgres:
    image: postgres:16
    container_name: internship_catalog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: internship_catalog
    ports:
      - "5432:5432"
    volumes:
      - internship_pgdata:/var/lib/postgresql/data

volumes:
  internship_pgdata:
